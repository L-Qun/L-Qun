name: Update profile stats

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generate stats with rank
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: stats
          options: username=L-Qun&show_icons=true&include_all_commits=true&hide=stars&show=prs_merged&theme=transparent&disable_animations=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: '2.1.5'
          fail_on_error: 'true'
      - name: Validate card before replacing the saved version
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          svg = Path('profile/stats.svg').read_text()
          root = ET.fromstring(svg)
          assert root.tag == '{http://www.w3.org/2000/svg}svg'
          text = ' '.join(root.itertext()).lower()
          assert 'something went wrong' not in text, 'Refusing to save an error card'
          assert 'commits' in text and 'rank' in text, 'Missing stats or rank'
      - name: Save successful card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update profile stats card"
          git push
